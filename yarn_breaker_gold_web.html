<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yarn Breaker - Otto's Retro Arcade</title>
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YarnBreaker">
    
    <style>
        :root {
            color-scheme: dark;
            --ink: #0c091a;
            --muted: #b6a9d1;
            --lavender: #c6a1ff;
            --gold: #ffcf83;
            font-family: "Trebuchet MS", system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff3ed;
            background:
                radial-gradient(ellipse at 50% 0%, #2b1848 0%, transparent 58%),
                radial-gradient(ellipse at 50% 100%, #1d1836 0%, #080611 64%);
        }

        #game-container {
            position: relative;
            overflow: hidden;
            border: 1px solid #765297;
            border-radius: 18px;
            background: var(--ink);
            box-shadow: 0 0 0 4px #150e27, 0 0 0 5px #392952, 0 20px 65px #060410;
        }

        #ui-top-bar {
            position: relative;
            z-index: 2;
            box-sizing: border-box;
            height: 56px;
            padding: 0 clamp(8px, 2vw, 17px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: linear-gradient(180deg, #241735, #160e25);
            border-bottom: 1px solid #674985;
        }

        .stats, .actions { display: flex; align-items: center; }
        .stats { gap: clamp(5px, 2.7vw, 19px); min-width: 0; }
        .actions { gap: 5px; }
        .stat { display: grid; gap: 2px; min-width: 0; }
        .stat-label {
            font: 700 9px/1.15 system-ui, sans-serif;
            letter-spacing: .07em;
            color: var(--muted);
        }
        .stat strong {
            overflow: hidden;
            text-overflow: ellipsis;
            font: 700 clamp(11px, 3vw, 16px)/1 Consolas, "Courier New", monospace;
            font-variant-numeric: tabular-nums;
        }
        #score-text { color: var(--gold); }
        #lives-text { color: #ff9fc9; letter-spacing: .08em; white-space: nowrap; }

        .ui-btn {
            width: 36px;
            height: 38px;
            padding: 0;
            display: grid;
            place-items: center;
            border: 1px solid #775c99;
            border-radius: 9px;
            color: #f8edff;
            background: #302044;
            font: 700 16px/1 system-ui, sans-serif;
            cursor: pointer;
        }
        .ui-btn:hover { background: #462e63; }
        button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        canvas {
            display: block;
            width: min(480px, calc(100vw - 20px), calc((100vh - 72px) * .8));
            width: min(480px, calc(100vw - 20px), calc((100dvh - 72px) * .8));
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }
        #game-container[data-state="START"] canvas { cursor: pointer; }

        #local-comment-panel {
            position: absolute;
            z-index: 3;
            inset: 56px 0 0;
            display: none;
            place-items: center;
            padding: 12px;
            background: #0a0617c7;
            backdrop-filter: blur(4px);
        }
        .otto-card {
            box-sizing: border-box;
            display: grid;
            gap: 10px;
            width: min(100%, 330px);
            padding: clamp(10px, 3vw, 26px);
            border: 1px solid #ac7fe1;
            border-radius: 15px;
            background: linear-gradient(160deg, #43295a, #190f2c 80%);
            box-shadow: 0 10px 35px #080613;
            text-align: center;
        }
        #result-title { margin: 0; color: var(--gold); font-size: clamp(15px, 4vw, 25px); }
        .otto-bubble { color: #eee1ff; font-size: clamp(12px, 3.4vw, 15px); line-height: 1.4; }
        #closePanelBtn {
            min-height: 36px;
            margin-top: 4px;
            padding: 7px 10px;
            border: 0;
            border-radius: 8px;
            color: #24102b;
            background: linear-gradient(110deg, #ffd388, #ff9cc7);
            font: 800 clamp(10px, 2.7vw, 13px)/1.2 system-ui, sans-serif;
            cursor: pointer;
        }

        @media (max-height: 420px) {
            #ui-top-bar { padding-inline: 5px; }
            .stats, .actions { gap: 4px; }
            .ui-btn { width: 27px; height: 34px; font-size: 13px; }
            .stat strong { font-size: 11px; }
            .stat-label { font-size: 8px; }
        }
    </style>
</head>
<body>

<main id="game-container" data-state="START">
    <div id="ui-top-bar">
        <div class="stats">
            <div class="stat"><span class="stat-label">PUNTI</span><strong id="score-text">0</strong></div>
            <div class="stat"><span class="stat-label">RECORD</span><strong id="record-text">0</strong></div>
            <div class="stat"><span class="stat-label">VITE</span><strong id="lives-text" aria-label="3 vite">♥♥♥</strong></div>
        </div>
        <div class="actions">
            <button class="ui-btn" id="pause-btn" title="Pausa (P)" aria-label="Pausa">Ⅱ</button>
            <button class="ui-btn" id="mute-btn" title="Audio (M)" aria-label="Disattiva audio">🔊</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="480" height="600" aria-label="Yarn Breaker. Premi Spazio per giocare e usa le frecce per muovere Otto."></canvas>

    <div id="local-comment-panel" role="dialog" aria-labelledby="result-title">
        <div class="otto-card">
            <h2 id="result-title"></h2>
            <div id="ottoResponse" class="otto-bubble"></div>
            <button id="closePanelBtn">GIOCA ANCORA</button>
        </div>
    </div>
</main>
